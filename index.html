<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
         <h1>Rick and Morty characters
         </h1>
<!--prompt 3:create a filter for the characters by status species and name-->
         <div id="filters">
    <label for="status">Status:</label>
    <select id="status">
      <option value="">All</option>
      <option value="alive">Alive</option>
      <option value="dead">Dead</option>
      <option value="unknown">Unknown</option>
    </select>

    <label for="species">Species:</label>
    <input type="text" id="species" placeholder="t.ex. Human">

    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="t.ex. Rick">

    <button id="applyFilter">Filter/Search</button>
  </div>

    </header>
    <!--prompt1 create a container for the characters-->
    
    <div class="characters-container"></div>
   <!--prompt 2 create buttons for pagination-->
    <div class="pagination">
         <button id="prev">
            Previous
        </button> 
        <button id="next">
            Next
        </button> 
    </div>
        
    
            
         
         
    
    <script src="script.js"></script>
</body>
</html>
